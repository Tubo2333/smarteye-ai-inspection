# SmartEye Docker Compose 配置
# 启动: docker-compose up
# 停止: docker-compose down

services:
  smarteye:
    build: .
    image: smarteye:latest
    container_name: smarteye
    ports:
      - "8501:8501"   # Streamlit 前端
      - "8000:8000"   # FastAPI 后端
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      # 持久化 ChromaDB 数据（重启不丢失）
      - chromadb_data:/app/data/chromadb
      # 持久化 YOLO 模型（避免每次重新训练）
      - models_data:/app/backend/models
    restart: unless-stopped

    # 如有 NVIDIA GPU，取消下面注释以启用 GPU 加速:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  chromadb_data:
  models_data:
